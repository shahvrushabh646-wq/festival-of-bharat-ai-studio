name: Daily 4 Reels
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for India trend selection"
        required: false
        default: ""
  schedule:
    - cron: "30 0 * * *"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build today's four Reels
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: python3 scripts/daily_reels.py
      - name: Upload four MP4 Reels
        uses: actions/upload-artifact@v4
        with:
          name: festival-of-bharat-4-reels-${{ github.run_number }}
          path: daily-output/
          retention-days: 7
