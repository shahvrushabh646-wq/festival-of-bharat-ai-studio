name: Daily 4 Reels
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic"
        required: false
        default: ""
      source_url:
        description: "Optional public source URL"
        required: false
        default: ""
      edit_request:
        description: "Morning re-edit request"
        required: false
        default: ""
      target_reel:
        description: "Reel 1-4 for targeted re-edit"
        required: false
        default: ""
  schedule:
    - cron: "30 20 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-reels
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Validate Python
        run: python3 -m py_compile scripts/daily_reels.py scripts/production_hotfix.py
      - name: Restore previous batch for targeted re-edit
        if: ${{ github.event.inputs.target_reel != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p daily-output
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          test -n "$TAG"
          gh release download "$TAG" --pattern 'reel_*.mp4' --dir daily-output --clobber
          test "$(find daily-output -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 4
      - name: Build four Reels
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          EDIT_REQUEST: ${{ github.event.inputs.edit_request }}
          TARGET_REEL: ${{ github.event.inputs.target_reel }}
        run: python3 scripts/daily_reels.py
      - name: Verify four real MP4 outputs
        run: |
          set -e
          test -f daily-output/manifest.json
          test -f daily-output/creator-pack.json
          count=$(find daily-output -maxdepth 1 -type f -name '*.mp4' | wc -l)
          test "$count" -eq 4
          for f in daily-output/*.mp4; do
            w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")
            h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")
            c=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f")
            test "$w" = "1080" && test "$h" = "1920" && test "$c" = "h264"
          done
      - name: Upload production outputs
        uses: actions/upload-artifact@v4
        with:
          name: festival-of-bharat-4-reels-${{ github.run_number }}
          path: daily-output/
          retention-days: 14
      - name: Publish daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          TAG="daily-${DATE}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" daily-output/*.mp4 daily-output/manifest.json daily-output/README.txt daily-output/creator-pack.json --target "${GITHUB_SHA}" --title "Festival of Bharat — 4 Reels — ${DATE}" --notes "Generated Reel batch. Human approval and rights verification required before posting."
