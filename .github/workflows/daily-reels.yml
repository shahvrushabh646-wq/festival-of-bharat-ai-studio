name: Daily 4 Reels
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for India trend selection"
        required: false
        default: ""
      source_url:
        description: "Optional public direct MP4 URL"
        required: false
        default: ""
  schedule:
    - cron: "30 0 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-reels
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr
      - name: Build today's four Reels
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: python3 scripts/daily_reels.py
      - name: Upload four MP4 Reels
        uses: actions/upload-artifact@v4
        with:
          name: festival-of-bharat-4-reels-${{ github.run_number }}
          path: daily-output/
          retention-days: 7

      - name: Publish daily MP4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          TAG="daily-${DATE}"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push --delete origin "${TAG}" 2>/dev/null || true
          gh release create "${TAG}" daily-output/*.mp4 daily-output/manifest.json daily-output/README.txt daily-output/creator-pack.json daily-output/stages/*.json             --target "${GITHUB_SHA}"             --title "Festival of Bharat — 4 Reels — ${DATE}"             --notes "Automated daily batch. Useful cultural content + four creative cuts. Virality is optimized for, not guaranteed. Verify each source license before posting; add eligible Instagram audio after approval."
