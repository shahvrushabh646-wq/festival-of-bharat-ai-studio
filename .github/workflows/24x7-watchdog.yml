name: 24x7 Reel Factory Watchdog
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Recover missing daily run during production window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          HOUR=$(TZ=Asia/Kolkata date +%H)
          [ "$HOUR" -ge 2 ] && [ "$HOUR" -lt 6 ] || exit 0
          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          if gh release view "daily-${DATE}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-reels.yml --status in_progress --json databaseId --jq 'length')
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-reels.yml --status queued --json databaseId --jq 'length')
          if [ "$running" -eq 0 ] && [ "$queued" -eq 0 ]; then gh workflow run daily-reels.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
