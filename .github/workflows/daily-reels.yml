name: Daily 4 Reels
# Production window: 02:00–06:00 IST. Morning review/edit cycle begins after the batch is ready.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic; leave blank for India trend selection"
        required: false
        default: ""
      source_url:
        description: "Optional public direct MP4 URL"
        required: false
        default: ""
      edit_request:
        description: "Morning human edit instructions for the next re-edit pass"
        required: false
        default: ""
  schedule:
    # 02:00 IST = 20:30 UTC on the previous day
    - cron: "30 20 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-reels
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr
      - name: Prepare live status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin status 2>/dev/null || true
          git show-ref --verify --quiet refs/remotes/origin/status || gh api repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/heads/status -f sha=${GITHUB_SHA} >/dev/null 2>&1 || true

      - name: Build today's four Reels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOPIC: ${{ github.event.inputs.topic }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          EDIT_REQUEST: ${{ github.event.inputs.edit_request }}
        run: python3 scripts/daily_reels.py
      - name: Record failed production status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/status/status.json?ref=status" --jq '.sha' 2>/dev/null || true)"
          python3 - <<'PY' > /tmp/failure-status.json
          import json, os, datetime
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          ist=datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          print(json.dumps({
            "date": datetime.datetime.now(ist).date().isoformat(),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
            "overall_percent": 0,
            "phase": "failed",
            "current_team": "Production",
            "current_employee": "AI Manager / CEO",
            "current_task": "Production failed. Open Run to view the error and recovery status.",
            "reel": None,
            "departments": {"Strategy & Research":"complete","Creative & Story":"complete","Production":"failed","Quality & Growth":"waiting"},
            "updated_at": now,
            "elapsed_seconds": None,
            "history": [],
            "error": "Production workflow failed. Check the GitHub Actions run logs."
          }))
          PY
          CONTENT="$(base64 -w0 /tmp/failure-status.json)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/status/status.json" -f message="Record failed production status" -f content="$CONTENT" -f branch="status" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/status/status.json" -f message="Record failed production status" -f content="$CONTENT" -f branch="status" >/dev/null
          fi

      - name: Upload four MP4 Reels
        uses: actions/upload-artifact@v4
        with:
          name: festival-of-bharat-4-reels-${{ github.run_number }}
          path: daily-output/
          retention-days: 7

      - name: Publish daily MP4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          TAG="daily-${DATE}"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push --delete origin "${TAG}" 2>/dev/null || true
          gh release create "${TAG}" daily-output/*.mp4 daily-output/manifest.json daily-output/README.txt daily-output/creator-pack.json daily-output/stages/*.json \
            --target "${GITHUB_SHA}" \
            --title "Festival of Bharat — 4 Reels — ${DATE}"             --notes "Automated daily batch. Useful cultural content + four creative cuts. Virality is optimized for, not guaranteed. Verify each source license before posting; add eligible Instagram audio after approval."
